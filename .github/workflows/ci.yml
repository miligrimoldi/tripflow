name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Only needed so the app's env validation passes during `next build`.
      DATABASE_URL: postgresql://tripflow:tripflow@localhost:5432/tripflow
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
